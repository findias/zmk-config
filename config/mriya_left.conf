# Central (left) half only.

# Report the right half's battery to the host as a second Battery Service, so a
# dying peripheral cell — the usual cause of "the right half keeps dropping" —
# is visible instead of guesswork.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
