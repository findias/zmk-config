# Applies to both halves (ZMK picks up ${ZMK_CONFIG}/${BOARD_DIR_NAME}.conf
# in addition to ${BOARD}.conf and merges them).

# --- Radio link robustness -------------------------------------------------
# ZMK_SPLIT_BLE selects BT_AUTO_PHY_UPDATE, so both links get bumped to the 2M
# PHY, which is ~6 dB less sensitive than 1M. Staying on 1M trades throughput
# we do not need for range and error tolerance on a crowded 2.4 GHz band.
CONFIG_BT_CTLR_PHY_2M=n

# nRF52840 defaults to 0 dBm. +8 dBm gives the split link and the host link
# a lot more headroom when a hand or a body is between the halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Deep sleep ------------------------------------------------------------
# ZMK_SLEEP is forced on in the board defconfigs, and ZMK_IDLE_SLEEP_TIMEOUT
# defaults to 15 min. Waking from System OFF means a full boot plus a BLE
# reconnect, and each half tracks activity from its own matrix only, so the
# right half sleeps on its own while you keep typing on the left. 60 min keeps
# that from happening during a working session.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
